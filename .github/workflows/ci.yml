name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "5.1"

      - uses: leafo/gh-actions-luarocks@v5

      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check lua

      - name: Install luacheck
        run: luarocks install luacheck

      - name: Run luacheck
        run: luacheck lua

      - name: Check Lua syntax
        run: find lua -name '*.lua' -print0 | xargs -0 -n1 luac -p

      - name: Install Neovim
        run: sudo apt-get update && sudo apt-get install -y neovim

      - name: Generate helptags
        run: nvim --headless -u NONE +"helptags doc" +qall

      - name: Run smoke test
        run: timeout 60s nvim --headless -u NONE +"lua dofile('scripts/smoke.lua')" +qall!

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install docs dependencies
        run: npm ci

      - name: Build docs
        run: npm run build
