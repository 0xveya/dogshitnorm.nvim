name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Lua toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cargo liblua5.1-0-dev lua5.1 luarocks neovim

      - name: Install StyLua
        run: cargo install stylua --locked

      - name: Check formatting
        run: ~/.cargo/bin/stylua --check lua

      - name: Install luacheck
        run: luarocks --lua-version=5.1 install --local luacheck

      - name: Run luacheck
        run: |
          eval "$(luarocks --lua-version=5.1 path)"
          luacheck lua

      - name: Check Lua syntax
        run: find lua -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p

      - name: Generate helptags
        run: nvim --headless -u NONE +"helptags doc" +qall

      - name: Run smoke test
        run: timeout 60s nvim --headless -u NONE +"lua dofile('scripts/smoke.lua')" +qall!

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install docs dependencies
        run: npm ci

      - name: Build docs
        run: npm run build
